# Publish packages for a version tag.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/packaging/check-tag-matches-version.sh "$TAG"

  packages:
    needs: check-tag
    uses: ./.github/workflows/packages.yml

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: release-in/source-tarball
      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: package-deb
          path: release-in/package-deb
      - name: Download rpm
        uses: actions/download-artifact@v4
        with:
          name: package-rpm
          path: release-in/package-rpm
      - name: Download pacman package
        uses: actions/download-artifact@v4
        with:
          name: package-pacman
          path: release-in/package-pacman
      - name: Write checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find release-in -type f -exec cp -t release {} +
          scripts/packaging/make-checksums.sh release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --title "$TAG" --generate-notes --verify-tag

  publish-aur:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/packaging/check-tag-matches-version.sh "$TAG"
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Gate AUR publish
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set. Skip AUR publish."
          fi
      - name: Update PKGBUILD checksum
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # makepkg exits when the user is root. The script runs the checksum tool as builder.
          docker run --rm -v "$PWD":/src -w /src -e VERSION="$VERSION" archlinux:latest bash -euo pipefail -c 'pacman -Syu --noconfirm --needed pacman-contrib ca-certificates && scripts/packaging/update-aur-checksum.sh "$VERSION"'
      - name: Publish AUR package
        if: steps.gate.outputs.enabled == 'true'
        # This action gets the AUR key. Pin a commit; a tag or branch can move (CWE-829).
        uses: KSXGitHub/github-actions-deploy-aur@a97f56a8425a7a7f3b8c58607f769c69b089cadb # v3.0.1
        with:
          pkgname: hotmon
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: colorlesspilgrimage
          commit_email: colorlesspilgrimage@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ steps.version.outputs.version }}
          test: true
          test_flags: "--clean --cleanbuild"
